<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>compile-pipeline</title>
    <!-- GSAP vendored locally: no render-time network. -->
    <script src="vendor/gsap.min.js"></script>
    <style>
      /* Fonts shipped in the project (OFL, from @fontsource 5.3.0). */
      @font-face {
        font-family: "JetBrains Mono";
        font-weight: 400;
        font-style: normal;
        src: url("assets/fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "JetBrains Mono";
        font-weight: 700;
        font-style: normal;
        src: url("assets/fonts/jetbrains-mono-latin-700-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Montserrat";
        font-weight: 400;
        font-style: normal;
        src: url("assets/fonts/montserrat-latin-400-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Montserrat";
        font-weight: 700;
        font-style: normal;
        src: url("assets/fonts/montserrat-latin-700-normal.woff2") format("woff2");
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0d1117;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0d1117;
      }
      /* Sub-composition slots stretch to fill the root. */
      #root > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-jx17"
      id="root"
      data-composition-id="compile-pipeline"
      data-start="0"
      data-duration="8"
      data-width="1920"
      data-height="1080"
    >
      <div data-hf-id="hf-la05"
        id="el-bg"
        data-composition-id="cp-bg"
        data-composition-src="compositions/cp-bg.html"
        data-track-kind="graphics"
        data-start="0"
        data-duration="8"
        data-track-index="0"
        data-width="1920"
        data-height="1080"
      ></div>
      <div data-hf-id="hf-1d0n"
        id="el-pipeline"
        data-composition-id="cp-pipeline"
        data-composition-src="compositions/cp-pipeline.html"
        data-track-kind="graphics"
        data-start="0"
        data-duration="8"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      // Guard: required when embedded via @hyperframes/player (runtime is injected after load).
      window.__timelines = window.__timelines || {};
      // Root timeline is intentionally empty; scenes own their motion.
      window.__timelines["compile-pipeline"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
