# A heap block that is never freed: Valgrind on Linux, leaks on macOS.
# The report question grades against this line; verify checks every Linux report points here.
bug: l.c:4
steps:
  all:
    - run: $CC $CFLAGS -o prog l.c
  linux:
    - run: valgrind --leak-check=full --error-exitcode=1 ./prog
      as: valgrind
      exit: fail
  macos:
    - run: leaks --atExit -- ./prog
      as: leaks
      exit: any
