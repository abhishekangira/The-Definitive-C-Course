id: pa-swap
kind: pa
title: Put swap() together
prompt: Arrange the lines into a program whose `swap` exchanges two ints through pointers and prints `2 1`.
runsIn: browser
hints:
  - "swap needs a temporary: you can't overwrite *a before you have saved it."
  - "Save *a, copy *b into *a, then put the saved value into *b. main declares x and y before calling swap(&x, &y)."
  - |
    int tmp = *a;
    *a = *b;
variants: []
parsons:
  distractors:
    - "int tmp = a;"
    - "swap(x, y);"
  indent: false
  accepted:
    - |
      #include <stdio.h>
      void swap(int *a, int *b) {
      int tmp = *a;
      *a = *b;
      *b = tmp;
      }
      int main(void) {
      int y = 2;
      int x = 1;
      swap(&x, &y);
      printf("%d %d\n", x, y);
      return 0;
      }
