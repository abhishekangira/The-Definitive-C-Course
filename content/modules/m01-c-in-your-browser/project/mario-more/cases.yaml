# Cases for `check.json`. Expected stdout and exit codes are generated: npm run exercises:expect
cases:
  - name: "height 1"
    stdin: "1\n"
    hint: "Compare your output character by character: two spaces between the pyramids and no spaces after the last #."
  - name: "height 2"
    stdin: "2\n"
    hint: "Compare your output character by character: two spaces between the pyramids and no spaces after the last #."
  - name: "height 3"
    stdin: "3\n"
    hint: "Compare your output character by character: two spaces between the pyramids and no spaces after the last #."
  - name: "height 4"
    stdin: "4\n"
    hint: "Compare your output character by character: two spaces between the pyramids and no spaces after the last #."
  - name: "height 5"
    stdin: "5\n"
    hint: "Compare your output character by character: two spaces between the pyramids and no spaces after the last #."
  - name: "height 6"
    stdin: "6\n"
    hint: "Compare your output character by character: two spaces between the pyramids and no spaces after the last #."
  - name: "height 7"
    stdin: "7\n"
    hint: "Compare your output character by character: two spaces between the pyramids and no spaces after the last #."
  - name: "height 8"
    stdin: "8\n"
    hint: "Compare your output character by character: two spaces between the pyramids and no spaces after the last #."
  - name: "rejects 0"
    stdin: "0\n1\n"
    hint: "Heights below 1 must be rejected: ask again."
  - name: "rejects 9"
    stdin: "9\n2\n"
    hint: "Compare your output character by character: two spaces between the pyramids and no spaces after the last #."
  - name: "rejects -1"
    stdin: "-1\n2\n"
    hint: "Compare your output character by character: two spaces between the pyramids and no spaces after the last #."
  - name: "rejects text"
    stdin: "abc\n2\n"
    hint: "Compare your output character by character: two spaces between the pyramids and no spaces after the last #."
  - name: "rejects an empty line"
    stdin: "\n2\n"
    hint: "Compare your output character by character: two spaces between the pyramids and no spaces after the last #."
  - name: "rejects 42x"
    stdin: "42x\n2\n"
    hint: "Compare your output character by character: two spaces between the pyramids and no spaces after the last #."
