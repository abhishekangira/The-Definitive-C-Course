id: hello-its-me/variants/1
kind: ct
title: Next birthday
prompt: 'Ask `Name? ` and then `Age? `, and print `<name>, next year you''ll be <age + 1>.`

  For example: `Ada, next year you''ll be 37.` Use `get_line` and `get_int`.

  '
runsIn: browser
hints:
- 'You need two inputs: one string, one int. Which `learnc.h` function returns each?'
- Use `%s` for the name and `%d` for `age + 1` in a single `printf`.
- '```

  const char *name = get_line("Name? ");

  int age = get_int("Age? ");

  printf("%s, next year you''ll be %d.\n", name, age + 1);

  ```'
file: birthday.c
variants: []
sampleStdin: 'Ada

  36

  '
