- id: cp-missing-brace
  type: ce
  prompt: "Clang reports the error at the very end of the file. What's actually wrong?"
  code: |
    #include <stdio.h>

    int main(void) {
        int count = 0;
        while (count < 3) {
            printf("%d\n", count);
            count++;

        return 0;
    }
  meta: expect=compile-error
  choices:
    - "`return 0;` must come before the loop"
    - "The `{` that opens the `while` body is never closed, so the closing `}` on the last line ends the loop and `main` is left open"
    - "`count++` needs to be written `count = count + 1`"
    - "`printf` can't be used inside a loop"
  answer: 1
  explain: "The `}` on the last line closes the `while` body, which leaves `main`'s own `{` unmatched. That's the brace the note \"to match this '{'\" points at, and clang only notices when the file ends. The actual mistake is the missing `}` after `count++;`. Where the compiler *notices* a problem isn't always where you *made* it."
- id: cp-frames
  type: md
  sample: cp-frames
  line: 5
  items: ["triple.n", "triple.result", "main.a"]
  prompt: "The program is paused just before `return result;` runs inside `triple`. Fill in the missing values."
  code: |
    #include <stdio.h>

    int triple(int n) {
        int result = n * 3;
        return result;
    }

    int main(void) {
        int a = 4;
        int b = triple(a + 1);
        printf("%d\n", b);
        return 0;
    }
  meta: trace predict=none
  explain: "`triple` receives a copy of the value `a + 1`, which is 5, so `result` is 15. `main`'s `a` is untouched: 4."
