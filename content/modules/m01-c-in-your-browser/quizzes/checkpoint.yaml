- id: cp-reprompt
  type: predict
  prompt: "The user types `-3`, presses Enter, then types `4` and presses Enter. What does the program print? (The input typed isn't part of the output.)"
  code: |
    #include <stdio.h>
    #include "learnc.h"

    int main(void) {
        int n;
        do {
            n = get_int("n: ");
        } while (n < 0);
        printf("%d\n", n * 2);
        return 0;
    }
  meta: stdin="-3\n4\n"
  explain: "The `do … while` body runs once, reads -3, and the condition `n < 0` is true, so it runs again and reads 4. The prompt appears twice, then `8` is printed."
