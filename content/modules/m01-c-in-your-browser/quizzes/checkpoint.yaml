# Module 1 checkpoint. Code questions are verified samples (tools/verify discovers items with `code`);
# their answers come from running them. Exercise items are graded by their tests. 80% to pass.
- id: cp-odd-total
  type: predict
  prompt: "What exactly does this program print?"
  code: |
    #include <stdio.h>

    int main(void) {
        int total = 0;
        for (int i = 1; i <= 5; i++) {
            if (i % 2 == 1) {
                total += i;
            }
        }
        printf("%d %d\n", total, total / 2);
        return 0;
    }
  explain: "The loop adds the odd numbers 1, 3 and 5, so `total` is 9. Then `9 / 2` is integer division: 4, not 4.5."
