- id: cp-scope-outcome
  type: outcome
  prompt: "What happens when you press Run?"
  code: |
    #include <stdio.h>

    int main(void) {
        for (int i = 0; i < 3; i++) {
            int square = i * i;
        }
        printf("%d\n", square);
        return 0;
    }
  meta: expect=compile-error
  explain: "`square` only exists inside the loop's braces. At the `printf` the name is out of scope, so clang reports an undeclared identifier and nothing runs."
- id: cp-half
  type: choice
  prompt: "What does this print?"
  code: |
    #include <stdio.h>

    int main(void) {
        int a = 5;
        int b = 2;
        double half = a / b;
        double better = (double)a / b;
        printf("%.1f %.1f\n", half, better);
        return 0;
    }
  choices:
    - "2.5 2.5"
    - "2.0 2.5"
    - "2 2.5"
    - "2.0 2.0"
  explain: "`a / b` is `int / int`, so it's 2 before it's ever stored in the `double`. The cast converts `a` first, so the second division is done in floating point."
