    detail: 'Chapter 2 "Hello, World!", chapter 3 "Variables and Statements", chapter 4 "Functions"'
    url: https://beej.us/guide/bgc/html/split/
  - title: "Kernighan & Ritchie, The C Programming Language (2nd ed.)"
    detail: "Chapter 1, sections 1.1–1.10 (A Tutorial Introduction)"
lessons:
