id: m01
number: 1
title: "C in Your Browser: From JS to C"
why: >-
  You write real C on day one with nothing to install. Real clang error messages replace TypeScript's
  "types are labels" habit with C's "types are memory layouts", and you meet the call stack you already
  know from DevTools, this time as actual memory.
hours: 10
weeks: 2
time: { lessons: 4, problemSet: 2, project: 2, variants: 1, quizCheckpoint: 1 }
lessonsRunIn: browser
