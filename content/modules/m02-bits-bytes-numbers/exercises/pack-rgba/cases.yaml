# Cases for `tests.json`. Expected stdout and exit codes are generated: npm run exercises:expect
cases:
  - name: "all channels zero"
    stdin: "0\n0\n0\n0\n"
  - name: "orange with alpha 64"
    stdin: "255\n128\n0\n64\n"
    hint: "Red is the top byte: `0xFF` shifted left by 24 gives `0xFF000000`."
  - name: "only red"
    stdin: "255\n0\n0\n0\n"
  - name: "only green"
    stdin: "0\n255\n0\n0\n"
  - name: "only blue"
    stdin: "0\n0\n255\n0\n"
  - name: "only alpha"
    stdin: "0\n0\n0\n255\n"
  - name: "every channel different"
    stdin: "18\n52\n86\n120\n"
  - name: "all channels 255"
    stdin: "255\n255\n255\n255\n"
