title: "Bits, Bytes & Numbers"
why: >-
  JavaScript hides everything behind one IEEE double. Pointers, files, hashing and assembly all assume
  that you are fluent in widths, signedness and bytes, so you learn to read the same bits as a number,
  a flag set, a colour or a character.
