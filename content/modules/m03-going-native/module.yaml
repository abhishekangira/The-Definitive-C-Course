id: m03
number: 3
title: "Going Native: Toolchain, Debugger, Sanitizers & Make"
why: >-
  The browser compiled and ran your C for you. Real C runs on your own machine: you install a compiler, run it
  by hand, step through a crash in a debugger, let the sanitizers find the memory bugs your eyes miss, and let
  make rebuild only what changed. Every later module works this way.
