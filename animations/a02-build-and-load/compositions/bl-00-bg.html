<template id="bl-00-bg-template">
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: var(--bg); }
    #bl00-grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(231, 233, 236, 0.07) 2px, transparent 2px),
        linear-gradient(90deg, rgba(231, 233, 236, 0.07) 2px, transparent 2px);
      background-size: 120px 120px;
    }
    #bl00-glow {
      position: absolute; left: 960px; top: -420px; width: 1500px; height: 1500px; border-radius: 50%;
      background: radial-gradient(circle, rgba(196, 167, 255, 0.17) 0%, rgba(196, 167, 255, 0) 62%);
    }
    #bl00-glow2 {
      position: absolute; left: -620px; top: 520px; width: 1300px; height: 1300px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 166, 87, 0.12) 0%, rgba(255, 166, 87, 0) 62%);
    }
  </style>
  <div id="root" data-composition-id="bl-00-bg" data-width="1920" data-height="1080" data-duration="75">
    <div id="bl00-grid" data-layout-ignore></div>
    <div id="bl00-glow" data-layout-ignore></div>
    <div id="bl00-glow2" data-layout-ignore></div>
  </div>
  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });
      // Soft glows only: a drifting grid of thin lines costs about 30% more bytes at CRF 30.
      tl.fromTo("#bl00-glow", { x: 0, y: 0, scale: 1 }, { x: -140, y: 90, scale: 1.12, duration: 37.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      tl.fromTo("#bl00-glow2", { x: 0, y: 0, scale: 1.08 }, { x: 160, y: -80, scale: 0.94, duration: 37.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["bl-00-bg"] = tl;
    })();
  </script>
</template>
