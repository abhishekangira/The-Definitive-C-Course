      // Run sends main.c in.
      draw("#pr02-in", 3.0, 0.6);
      tl.fromTo("#pr02-packet", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "none" }, 3.0);
      tl.fromTo("#pr02-packet", { x: 0 }, { x: 24, duration: 0.55, ease: "power2.inOut", immediateRender: false }, 3.1);
      tl.fromTo("#pr02-packet", { opacity: 1 }, { opacity: 0, duration: 0.15, ease: "none", immediateRender: false }, 3.6);
