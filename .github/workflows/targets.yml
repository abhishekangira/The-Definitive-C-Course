# Runs every sample natively on the other targets (PLAN.md §3.2) and commits the outputs to
# src/generated/targets/<target>/. The Linux x86-64 and browser results come from `npm run verify`.
#   macOS arm64 (Apple clang):        all samples
#   Linux aarch64 (gcc):              all samples
#   Windows x64 (MSVC cl /std:c17):   platform samples only (the verifier filters them)
name: Targets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'src/runtime/c/**'
      - 'tools/verify/**'
  # The project-runner job below also runs on PRs that touch it (the sample job does not).
  pull_request:
    paths:
      - 'tools/check/**'
      - '!tools/check/**/*.md'  # docs-only edits (the README table) don't need real runners
      - 'tools/ci/verify-project-run.ts'
      - 'src/testing/**'
      - 'content/modules/m01-c-in-your-browser/project/mario-more/**'
      - 'content/modules/m02-bits-bytes-numbers/project/credit/**'
      - 'content/modules/m03-going-native/**'
      - '.github/workflows/targets.yml'

permissions:
  contents: read

concurrency:
  # PR runs get their own group per ref so they never queue behind (or replace a pending) run on main.
  group: ${{ github.event_name == 'pull_request' && format('targets-pr-{0}', github.ref) || 'targets' }}
  cancel-in-progress: false

jobs:
  run:
    # Sample verification is slow and its outputs are committed from main only.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64-appleclang
            os: macos-14
          - target: linux-aarch64-gcc
            os: ubuntu-24.04-arm
          - target: windows-x64-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - run: npm ci
      # On macOS this also runs the macOS steps of every native session (<module>.sessions.json, docs/adr/0005).
      - name: Run samples natively
        run: npx tsx tools/verify/cli.ts --target-run ${{ matrix.target }} --out targets-out/${{ matrix.target }}
      # The fixture sessions (tools/verify/fixtures, one per kind of tool output) show that the macOS capture works on this
      # runner. Manual runs only: the artifact is for review and is never committed (it is not a target-* artifact).
      # --strict-sessions: an unstable or failing session fails this step (the artifact is still uploaded), whereas
      # "Run samples natively" only warns, so the macOS sample results are still committed.
      - name: Run the fixture sessions
        id: fixture-sessions
        if: github.event_name == 'workflow_dispatch' && matrix.target == 'macos-arm64-appleclang'
        run: npx tsx tools/verify/cli.ts --target-run ${{ matrix.target }} --content-root tools/verify/fixtures/content --module m97 --out sessions-fixture --strict-sessions
      - uses: actions/upload-artifact@v4
        if: always() && steps.fixture-sessions.outcome != 'skipped'
        with:
          name: sessions-fixture-${{ matrix.target }}
          path: sessions-fixture
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: target-${{ matrix.target }}
          path: targets-out/${{ matrix.target }}
          retention-days: 7

  # check.mjs end to end on the learner platforms we cannot run locally (issue #10): build the project zip
  # (or an LT exercise's: m03-doctor, lesson 3.1), `make test` the starter (must fail, progress code) and the
  # solution (must pass, completion token), and check each code with the app's verifyCode(). Windows is not run (WSL only).
  project-runner:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04-arm]
        project: [mario-more, credit, m03-doctor]
        include:
          - project: mario-more
            path: content/modules/m01-c-in-your-browser/project/mario-more
          - project: credit
            path: content/modules/m02-bits-bytes-numbers/project/credit
          # An LT exercise: its codes name the exercise id, not project/<id>. Its memory check is the ASan smoke test.
          - project: m03-doctor
            path: content/modules/m03-going-native/exercises/m03-doctor
            exercise: m03-doctor
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      EXERCISE: ${{ matrix.exercise || format('project/{0}', matrix.project) }}
      PROJECT: ${{ matrix.path }}
      NAME: ${{ matrix.project }}
      SEED: 0123456789abcdef
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Log the runner
        run: |
          uname -a
          node --version
          make --version | head -1
          cc --version | head -1
          command -v gcc clang || true
      # The environment report of lesson 3.1 (issue #73), once per runner. The grading steps below don't read its
      # output. It can still fail the job: these runners have a compiler and Node >= 18, so a non-zero exit is a doctor bug.
      - name: Doctor (node check.mjs --doctor)
        if: matrix.project == 'mario-more'
        run: |
          node tools/check/build.mjs
          node dist-tools/check.mjs --doctor
      - name: Starter must fail with a progress code
        run: |
          rm -rf work/starter && mkdir -p work/starter
          node tools/check/build.mjs --zip "$PROJECT" --out work/starter.zip --seed "$SEED"
          unzip -q work/starter.zip -d work/starter
          set +e
          (cd "work/starter/$NAME" && make test) 2>&1 | tee work/starter.log
          code=${PIPESTATUS[0]}
          set -e
          echo "make test exit status: $code"
          npx tsx tools/ci/verify-project-run.ts starter "$SEED" "$EXERCISE" "$code" work/starter.log
      - name: Solution must pass with a completion token
        run: |
          rm -rf work/solution && mkdir -p work/solution
          node tools/check/build.mjs --zip "$PROJECT" --out work/solution.zip --solution --seed "$SEED"
          unzip -q work/solution.zip -d work/solution
          set +e
          (cd "work/solution/$NAME" && make test) 2>&1 | tee work/solution.log
          code=${PIPESTATUS[0]}
          set -e
          echo "make test exit status: $code"
          npx tsx tools/ci/verify-project-run.ts solution "$SEED" "$EXERCISE" "$code" work/solution.log

  commit:
    needs: run
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: targets-out
          pattern: target-*
      - name: Commit changed target outputs
        run: |
          shopt -s nullglob
          for dir in targets-out/target-*; do
            target="${dir#targets-out/target-}"
            mkdir -p "src/generated/targets/$target"
            cp "$dir"/*.json "src/generated/targets/$target/"
          done
          if [ -n "$(git status --porcelain src/generated/targets)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/generated/targets
            git commit -m "Update native target outputs"
            git push
          else
            echo "Target outputs unchanged."
          fi
