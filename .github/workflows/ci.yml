# Checks every change, and deploys main to GitHub Pages when everything is green.
# Native toolchain per PLAN.md §2–§3: gcc 13 (Ubuntu 24.04), clang 22 and lldb 22 from apt.llvm.org, gdb, valgrind, FFmpeg.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # A cache restore that stalls (GitHub's cache storage once throttled one for the default 10 min) gives up after
  # about 2 min and the job carries on uncached.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the change is documentation only (tools/ci/docs-only.mjs: an allowlist of root docs, AGENTS.md notes, skills and research/).
  # `check` always runs, so a required status check still reports, but a docs-only pull request skips the native
  # toolchain, verify and test steps there, and the whole `e2e` job (build, e2e, WebM). Pushes, manual runs and anything outside the allowlist run everything.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.docs.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          # On a pull request this is the merge commit: HEAD^1 is the base, so the diff is what merging brings in.
          fetch-depth: 2
          persist-credentials: false
      - name: Classify the change
        id: docs
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] \
             && [ "$(git diff --name-only HEAD^1 HEAD | node tools/ci/docs-only.mjs)" = "true" ]; then
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Documentation only: the heavy checks are skipped."
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # This job runs PR-authored code (npm ci, tests, e2e), so it only ever gets a read-only token.
    # Committing regenerated files is done by the separate `commit-generated` job below.
    outputs:
      stale: ${{ steps.regen.outputs.stale }}
    env:
      # gcc/clang quote with Unicode quotes in UTF-8 locales; tests and verify compare ASCII diagnostics.
      LC_ALL: C
    steps:
      - uses: actions/checkout@v4
        with:
          # Same-repo PRs: check out the PR head commit itself (not the merge ref), so the regenerated files are
          # built from exactly the commit that `commit-generated` later pushes onto.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.sha || '' }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The .deb files install-native.sh downloads, so a run installs from the cache instead of the Ubuntu mirror.
      # The key changes with the script and every ISO week; a new week starts from last week's files (restore-keys).
      - name: Week for the apt cache key
        id: week
        if: needs.changes.outputs.code == 'true'
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Cache apt packages
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/tdcc-apt
          key: apt-native-${{ runner.os }}-${{ hashFiles('tools/environment/install-native.sh') }}-${{ steps.week.outputs.week }}
          restore-keys: apt-native-${{ runner.os }}-${{ hashFiles('tools/environment/install-native.sh') }}-
      - name: Install the native toolchain
        if: needs.changes.outputs.code == 'true'
        # Usually under 1 min. A crawling Ubuntu mirror once took 22 min (144 kB/s); fail fast and re-run instead.
        timeout-minutes: 10
        # mkdir first: as root, the script would create ~/.cache itself, root-owned, and later steps (Playwright) fail with EACCES.
        run: mkdir -p "$HOME/.cache/tdcc-apt" && sudo TDCC_APT_ARCHIVES="$HOME/.cache/tdcc-apt" bash tools/environment/install-native.sh

      - name: Log the reference environment
        if: needs.changes.outputs.code == 'true'
        run: |
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
          grep PRETTY_NAME /etc/os-release
          for c in "gcc-13 --version" "clang-22 --version" "lldb-22 --version" "gdb --version" "valgrind --version" "node --version" "ffmpeg -version"; do
            echo "$c: $($c 2>&1 | head -1)"
          done

      - run: npm ci

      - name: Prepare the browser toolchain
        if: needs.changes.outputs.code == 'true'
        run: npm run toolchain:prepare

      - name: Cache sample verification
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: .cache/verify
          key: verify-${{ runner.os }}-${{ hashFiles('content/**', 'src/runtime/c/**', 'tools/verify/**', 'tools/shared/**', 'package-lock.json') }}
          restore-keys: verify-${{ runner.os }}-

      # CI owns src/generated/{samples,traces,sessions}. On a same-repo PR, regenerate them here (read-only token) and,
      # if a behaviour change shows up, hand the files to the `commit-generated` job as an artifact. This run
      # then skips the remaining checks and fails (last step), because they would be judging a head that is
      # about to be replaced. Fork PRs and pushes to main skip this and rely on the --check steps below.
      # verify keeps files that differ only by version strings or UB garbage, so a PR that changes no code
      # fence produces no commit.
      - name: Regenerate samples, traces and sessions
        id: regen
        if: needs.changes.outputs.code == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          npm run verify
          if [ -n "$(git status --porcelain src/generated/samples src/generated/traces src/generated/sessions)" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            mkdir -p regenerated
            git ls-files -m -o --exclude-standard src/generated/samples src/generated/traces src/generated/sessions | tar -cf regenerated/files.tar -T -
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "Generated files already match."
          fi
      - uses: actions/upload-artifact@v4
        if: steps.regen.outputs.stale == 'true'
        with:
          name: regenerated
          path: regenerated/files.tar
          retention-days: 1
      - name: Stop, the generated files are stale
        if: steps.regen.outputs.stale == 'true'
        run: |
          echo "src/generated changed; the commit-generated job pushes it and dispatches CI for the new head."
          echo "The remaining checks would judge a head that is about to be replaced, so this run fails here on purpose."
          exit 1

      - name: Typecheck
        if: needs.changes.outputs.code == 'true'
        run: npm run typecheck
      - name: Unit tests
        if: needs.changes.outputs.code == 'true'
        run: npm test
      - run: npm run lint:content
      - name: Agent-notes and CI-classifier tests (docs-only PRs; npm test covers them otherwise)
        if: needs.changes.outputs.code != 'true'
        run: npx vitest run tools/docs tools/ci
      - name: Generated sample outputs are up to date
        if: needs.changes.outputs.code == 'true'
        run: npm run verify -- --check
      - name: Generated traces are up to date
        if: needs.changes.outputs.code == 'true'
        run: npm run trace -- --check
      - name: Solutions pass, starters fail
        if: needs.changes.outputs.code == 'true'
        run: npm run verify:exercises
      - name: Videos (offline checks; CI never calls yt-dlp)
        if: needs.changes.outputs.code == 'true'
        run: npm run videos:check
      - name: Animations (static checks, no browser)
        if: needs.changes.outputs.code == 'true'
        run: node tools/anim/check.mjs --static

  # The browser half of CI, in parallel with `check` (it needs no C toolchain, only FFmpeg for the animation spec and the
  # WebM transcode). Playwright shards whole files because fullyParallel is false, so serial groups stay on one worker,
  # and each runner keeps the config's 2 workers (docs/adr/0002-e2e-workers.md). Shard 1 also makes the Pages artifact.
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: e2e (${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      LC_ALL: C
    steps:
      - uses: actions/checkout@v4
        with:
          # The same commit `check` tests (see there).
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.sha || '' }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Same as the apt cache in `check`, for FFmpeg only.
      - name: Week for the apt cache key
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/tdcc-apt
          key: apt-ffmpeg-${{ runner.os }}-${{ hashFiles('tools/environment/install-native.sh') }}-${{ steps.week.outputs.week }}
          restore-keys: apt-ffmpeg-${{ runner.os }}-${{ hashFiles('tools/environment/install-native.sh') }}-
      - name: Install FFmpeg
        timeout-minutes: 10
        # mkdir first: as root, the script would create ~/.cache itself, root-owned, and later steps (Playwright) fail with EACCES.
        run: mkdir -p "$HOME/.cache/tdcc-apt" && sudo TDCC_APT_ARCHIVES="$HOME/.cache/tdcc-apt" bash tools/environment/install-native.sh --ffmpeg-only

      - run: npm ci

      - name: Build
        # Public OAuth client id for Google Drive sync (a repository variable, not a secret); unset hides the feature.
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
        run: npm run build

      # Playwright's own Chromium download, keyed on the installed Playwright version. The install step still runs:
      # on a hit it downloads nothing and only checks the system libraries.
      - name: Playwright version
        id: playwright
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright's Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end click-through
        run: npm run e2e -- --shard=${{ matrix.shard }}/2 --reporter=list,blob
      # Every shard uploads its blob report (small when green: traces are kept only on failure); `e2e-report` merges them.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

      - name: Transcode animations to WebM
        if: matrix.shard == 1
        run: node tools/anim/render.mjs --webm dist/animations

      - uses: actions/upload-pages-artifact@v3
        if: matrix.shard == 1 && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: dist

  # When a shard fails, merges the shards' blob reports into one HTML report (with traces and screenshots).
  e2e-report:
    needs: e2e
    if: always() && needs.e2e.result == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.sha || '' }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - run: npx playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # The only job with write access. It runs none of the PR's build or test code (no npm, no tests): it unpacks the files produced by `check`
  # (validated by tools/ci/unpack-generated.mjs: regular files under src/generated/{samples,traces,sessions} only), commits them as the bot and dispatches CI for the new head.
  #   contents: write  -> git push to the PR branch
  #   actions: write   -> `gh workflow run` (workflow_dispatch). Needed because a push made with GITHUB_TOKEN does
  #                       not trigger workflows, so the new head would otherwise get no CI run at all.
  commit-generated:
    needs: check
    if: always() && needs.check.outputs.stale == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HEAD_REF: ${{ github.head_ref }}
      TESTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/download-artifact@v4
        with:
          name: regenerated
          path: ${{ runner.temp }}/regenerated
      - name: Commit and dispatch CI
        run: |
          if [ "$(git rev-parse HEAD)" != "$TESTED_SHA" ]; then
            echo "The branch moved since this run started; the author's push gets its own run, which regenerates again."
            exit 0
          fi
          # The tarball comes from a job that ran PR-authored code, so treat it as hostile. The validator
          # (tools/ci/unpack-generated.mjs, node built-ins only, unit-tested) accepts only regular files strictly under
          # src/generated/{samples,traces,sessions}/ (no "..", absolute, "./", backslash, links, devices, directories or
          # extension headers), checks every member before writing anything, and writes 0644 files into a clean dir.
          node tools/ci/unpack-generated.mjs "$RUNNER_TEMP/regenerated/files.tar" "$RUNNER_TEMP/unpacked"
          # Never copy through a symlink that the branch itself may contain.
          if find src/generated -type l | grep -q .; then echo "Symlink under src/generated"; exit 1; fi
          cp -r "$RUNNER_TEMP/unpacked/src/generated/." src/generated/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/generated/samples src/generated/traces
          # src/generated/sessions/ is untracked until a module has a session; `git add` of a missing path exits 128.
          if [ -d src/generated/sessions ]; then git add src/generated/sessions; fi
          git commit -m "Regenerate samples, traces and sessions (CI)"
          git push origin "HEAD:refs/heads/$HEAD_REF"
          gh workflow run ci.yml --ref "$HEAD_REF"

  deploy:
    needs: [check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
