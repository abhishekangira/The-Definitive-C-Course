# Checks every change, and deploys main to GitHub Pages when everything is green.
# Native toolchain per PLAN.md §2–§3: gcc 13 (Ubuntu 24.04), clang 22 from apt.llvm.org, gdb, valgrind, FFmpeg.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the change is documentation only (tools/ci/docs-only.mjs: an allowlist of root docs, AGENTS.md notes, skills and research/).
  # `check` always runs, so a required status check still reports, but a docs-only pull request skips the native
  # toolchain, verify, build and e2e steps. Pushes, manual runs and anything outside the allowlist run everything.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.docs.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          # On a pull request this is the merge commit: HEAD^1 is the base, so the diff is what merging brings in.
          fetch-depth: 2
          persist-credentials: false
      - name: Classify the change
        id: docs
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] \
             && [ "$(git diff --name-only HEAD^1 HEAD | node tools/ci/docs-only.mjs)" = "true" ]; then
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Documentation only: the heavy checks are skipped."
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # This job runs PR-authored code (npm ci, tests, e2e), so it only ever gets a read-only token.
    # Committing regenerated files is done by the separate `commit-generated` job below.
    outputs:
      stale: ${{ steps.regen.outputs.stale }}
    env:
      # gcc/clang quote with Unicode quotes in UTF-8 locales; tests and verify compare ASCII diagnostics.
      LC_ALL: C
    steps:
      - uses: actions/checkout@v4
        with:
          # Same-repo PRs: check out the PR head commit itself (not the merge ref), so the regenerated files are
          # built from exactly the commit that `commit-generated` later pushes onto.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.sha || '' }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install the native toolchain
        if: needs.changes.outputs.code == 'true'
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/keyrings/apt.llvm.org.asc >/dev/null
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-22.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-13 clang-22 lld-22 libclang-rt-22-dev gdb valgrind ffmpeg python3

      - name: Log the reference environment
        if: needs.changes.outputs.code == 'true'
        run: |
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
          grep PRETTY_NAME /etc/os-release
          for c in "gcc-13 --version" "clang-22 --version" "gdb --version" "valgrind --version" "node --version" "ffmpeg -version"; do
            echo "$c: $($c 2>&1 | head -1)"
          done

      - run: npm ci

      - name: Prepare the browser toolchain
        if: needs.changes.outputs.code == 'true'
        run: npm run toolchain:prepare

      - name: Cache sample verification
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: .cache/verify
          key: verify-${{ runner.os }}-${{ hashFiles('content/**', 'src/runtime/c/**', 'tools/verify/**', 'tools/shared/**', 'package-lock.json') }}
          restore-keys: verify-${{ runner.os }}-

      # CI owns src/generated/{samples,traces}. On a same-repo PR, regenerate them here (read-only token) and,
      # if a behaviour change shows up, hand the files to the `commit-generated` job as an artifact. This run
      # then skips the remaining checks and fails (last step), because they would be judging a head that is
      # about to be replaced. Fork PRs and pushes to main skip this and rely on the --check steps below.
      # verify keeps files that differ only by version strings or UB garbage, so a PR that changes no code
      # fence produces no commit.
      - name: Regenerate samples and traces
        id: regen
        if: needs.changes.outputs.code == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          npm run verify
          if [ -n "$(git status --porcelain src/generated/samples src/generated/traces)" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            mkdir -p regenerated
            git ls-files -m -o --exclude-standard src/generated/samples src/generated/traces | tar -cf regenerated/files.tar -T -
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "Generated files already match."
          fi
      - uses: actions/upload-artifact@v4
        if: steps.regen.outputs.stale == 'true'
        with:
          name: regenerated
          path: regenerated/files.tar
          retention-days: 1
      - name: Stop, the generated files are stale
        if: steps.regen.outputs.stale == 'true'
        run: |
          echo "src/generated changed; the commit-generated job pushes it and dispatches CI for the new head."
          echo "The remaining checks would judge a head that is about to be replaced, so this run fails here on purpose."
          exit 1

      - name: Typecheck
        if: needs.changes.outputs.code == 'true'
        run: npm run typecheck
      - name: Unit tests
        if: needs.changes.outputs.code == 'true'
        run: npm test
      - run: npm run lint:content
      - name: Agent-notes and CI-classifier tests (docs-only PRs; npm test covers them otherwise)
        if: needs.changes.outputs.code != 'true'
        run: npx vitest run tools/docs tools/ci
      - name: Generated sample outputs are up to date
        if: needs.changes.outputs.code == 'true'
        run: npm run verify -- --check
      - name: Generated traces are up to date
        if: needs.changes.outputs.code == 'true'
        run: npm run trace -- --check
      - name: Solutions pass, starters fail
        if: needs.changes.outputs.code == 'true'
        run: npm run verify:exercises
      - name: Videos (offline checks; CI never calls yt-dlp)
        if: needs.changes.outputs.code == 'true'
        run: npm run videos:check
      - name: Animations (static checks, no browser)
        if: needs.changes.outputs.code == 'true'
        run: node tools/anim/check.mjs --static

      - name: Build
        if: needs.changes.outputs.code == 'true'
        # Public OAuth client id for Google Drive sync (a repository variable, not a secret); unset hides the feature.
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
        run: npm run build

      - name: Install Playwright's Chromium
        if: needs.changes.outputs.code == 'true'
        run: npx playwright install --with-deps chromium
      - name: End-to-end click-through
        if: needs.changes.outputs.code == 'true'
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure() && needs.changes.outputs.code == 'true'
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Transcode animations to WebM
        if: needs.changes.outputs.code == 'true'
        run: node tools/anim/render.mjs --webm dist/animations

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: dist

  # The only job with write access. It runs none of the PR's build or test code (no npm, no tests): it unpacks the files produced by `check`
  # (validated by tools/ci/unpack-generated.mjs: regular files under src/generated/{samples,traces} only), commits them as the bot and dispatches CI for the new head.
  #   contents: write  -> git push to the PR branch
  #   actions: write   -> `gh workflow run` (workflow_dispatch). Needed because a push made with GITHUB_TOKEN does
  #                       not trigger workflows, so the new head would otherwise get no CI run at all.
  commit-generated:
    needs: check
    if: always() && needs.check.outputs.stale == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HEAD_REF: ${{ github.head_ref }}
      TESTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/download-artifact@v4
        with:
          name: regenerated
          path: ${{ runner.temp }}/regenerated
      - name: Commit and dispatch CI
        run: |
          if [ "$(git rev-parse HEAD)" != "$TESTED_SHA" ]; then
            echo "The branch moved since this run started; the author's push gets its own run, which regenerates again."
            exit 0
          fi
          # The tarball comes from a job that ran PR-authored code, so treat it as hostile. The validator
          # (tools/ci/unpack-generated.mjs, node built-ins only, unit-tested) accepts only regular files strictly under
          # src/generated/{samples,traces}/ (no "..", absolute, "./", backslash, links, devices, directories or
          # extension headers), checks every member before writing anything, and writes 0644 files into a clean dir.
          node tools/ci/unpack-generated.mjs "$RUNNER_TEMP/regenerated/files.tar" "$RUNNER_TEMP/unpacked"
          # Never copy through a symlink that the branch itself may contain.
          if find src/generated -type l | grep -q .; then echo "Symlink under src/generated"; exit 1; fi
          cp -r "$RUNNER_TEMP/unpacked/src/generated/." src/generated/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/generated/samples src/generated/traces
          git commit -m "Regenerate samples and traces (CI)"
          git push origin "HEAD:refs/heads/$HEAD_REF"
          gh workflow run ci.yml --ref "$HEAD_REF"

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
