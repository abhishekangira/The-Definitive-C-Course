# The 3c quiz items over generated data: sp on a gdb trace (add-frames, via src/generated/traces), and ce and order
# items that use the m97 fixture sessions (tools/verify's stored output). No answer here is typed from tool output:
# sp's comes from the trace, order's from the stored run, ce's `answer` is the authored explanation.
- id: q-sp-step-into
  type: sp
  sample: add-frames
  line: 11
  prompt: "The program is paused before the call to `add`. You type `step`."
  explain: "`step` goes into the function being called, so the next line is the first line of `add`; `next` would run the whole call and stop at the `printf`."
- id: q-ce-link
  type: ce
  session: link-undefined
  step: 2
  stage: link
  prompt: "The compile succeeded. This is the next command and what it printed. What is wrong?"
  choices: ["`area` is declared and called, but no file defines it", "A semicolon is missing in `main.c`", "`main.o` is not a valid object file"]
  answer: 0
  explain: "The linker looks for a definition of every function the objects call. `main.c` only declares `area`, so no object defines it."
- id: q-ce-asan
  type: ce
  session: asan
  stage: run
  prompt: "The program built cleanly with AddressSanitizer and then printed this. What is wrong?"
  choices: ["It writes past the end of an array", "It leaks memory", "It divides by zero"]
  answer: 0
  explain: "A stack-buffer-overflow WRITE is a write past the end of an array on the stack: the loop runs to `i <= 4`."
- id: q-order-make
  type: order
  session: make
  prompt: "Put the commands in the order that shows a build, then nothing to do, then a header change, then a broken Makefile."
  items: ["make && ./credit", "make", "sleep 1 && touch luhn.h && make", "make -f spaces.mk"]
  explain: "The first `make` builds everything; the second finds nothing newer than its targets; touching `luhn.h` makes both objects that include it out of date; `spaces.mk` indents a recipe with spaces, which make rejects."
